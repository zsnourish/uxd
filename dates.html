<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team dates · Nourish UX and Design</title>
  <link rel="icon" type="image/png" href="/assets/nourish-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />

</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="/" aria-label="Nourish UX and Design noticeboard home">
        <img src="/assets/nourish-logo.png" alt="Nourish" class="brand-logo" />
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-text"><strong>UX and Design</strong><span>Team noticeboard</span></span>
      </a>
      <nav class="tabs">
        <a href="/">Updates</a>
        <a href="/dates.html" class="active">Team dates</a>
        <a href="/visits">Site visits</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <p class="eyebrow">UX and Design at Nourish</p>
      <h1 class="page-title">Team dates</h1>
      <p class="page-sub">Team days, kickoffs and events coming up.</p>
    </div>
  </section>

  <main class="wrap">

    <div class="filters" role="group" aria-label="Filter events">
      <div class="chips">
      <span class="filters-label">Show</span>
      <button type="button" class="chip team" data-cat="team" aria-pressed="false"><span class="chip-dot"></span><svg class="chip-tick" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>UX/Design team events</button>
      <button type="button" class="chip org" data-cat="org" aria-pressed="false"><span class="chip-dot"></span><svg class="chip-tick" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Nourish org events</button>
      <button type="button" class="chip external" data-cat="external" aria-pressed="false"><span class="chip-dot"></span><svg class="chip-tick" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Non-Nourish events</button>
      <button type="button" class="chip-clear" hidden>Show all</button>
      </div>
      <button type="button" class="past-toggle" aria-expanded="false" aria-controls="past" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Past events</span></button>
    </div>

    <div id="content">
      <div class="state">Loading events…</div>
    </div>
  </main>

  <footer class="site"><img src="/assets/nourish-mark.png" alt="" class="footer-mark" />Nourish UX and Design team</footer>

  <script src="/assets/rich.js"></script>
  <script>
    const CATEGORY_CLASS = {
      'Nourish org events': 'category-org',
      'Non-Nourish events': 'category-external'
    };
    const catKey = item => (CATEGORY_CLASS[item.category] || 'category-team').replace('category-', '');

    // Filter chips: none selected shows everything; selecting narrows to those types.
    let allEvents = null;
    const picked = new Set();
    document.querySelectorAll('.chip[data-cat]').forEach(chip => {
      chip.addEventListener('click', () => {
        const c = chip.dataset.cat;
        picked.has(c) ? picked.delete(c) : picked.add(c);
        syncChips();
        if (allEvents) render(allEvents);
      });
    });
    document.querySelector('.chip-clear').addEventListener('click', () => {
      picked.clear(); syncChips(); if (allEvents) render(allEvents);
      document.querySelector('.chip[data-cat]').focus();
    });
    let showPast = false;
    document.querySelector('.past-toggle').addEventListener('click', e => {
      showPast = !showPast;
      e.currentTarget.setAttribute('aria-expanded', String(showPast));
      if (allEvents) render(allEvents);
      if (showPast) document.getElementById('past')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    function syncChips() {
      document.querySelectorAll('.chip[data-cat]').forEach(ch => ch.setAttribute('aria-pressed', String(picked.has(ch.dataset.cat))));
      document.querySelector('.chip-clear').hidden = !picked.size;
    }

    async function loadEvents() {
      const el = document.getElementById('content');
      try {
        const res = await fetch('/.netlify/functions/events');
        if (!res.ok) throw new Error('Request failed: ' + res.status);
        const data = await res.json();
        if (!data.length) {
          el.innerHTML = '<div class="state">No events yet.</div>';
          return;
        }
        data.sort((a, b) => new Date(a.dateStart) - new Date(b.dateStart));
        allEvents = data;
        render(data);
      } catch (err) {
        el.innerHTML = '<div class="state error">Couldn\'t load events right now (' + err.message + '). Check that the Netlify function is deployed and NOTION_TOKEN is set.</div>';
      }
    }

    function render(all) {
      const el = document.getElementById('content');
      const data = picked.size ? all.filter(item => picked.has(catKey(item))) : all;
      {
        const today = new Date(); today.setHours(0,0,0,0);
        const upcoming = data.filter(item => new Date(item.dateStart) >= today);
        const past = data.filter(item => new Date(item.dateStart) < today).reverse(); // most recent past first

        let html = upcoming.length
          ? renderGrouped(upcoming)
          : '<div class="state">' + (picked.size ? 'No upcoming events of this type.' : 'No upcoming events.') + '</div>';

        const toggle = document.querySelector('.past-toggle');
        toggle.hidden = !past.length;
        toggle.querySelector('span').textContent = 'Past events (' + past.length + ')';
        if (past.length && showPast) {
          html += '<section id="past" class="past-events" aria-label="Past events"><h2 class="past-heading">Past events</h2>' + renderGrouped(past) + '</section>';
        }

        el.innerHTML = html;
        wireReadMore();
      }
    }

    function renderGrouped(events) {
      let html = '';
      let currentMonth = '';
      events.forEach(item => {
        const d = new Date(item.dateStart);
        const monthLabel = d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
        if (monthLabel !== currentMonth) {
          html += '<div class="month-heading">' + monthLabel + '</div>';
          currentMonth = monthLabel;
        }
        html += renderRow(item, d);
      });
      return html;
    }

    function renderRow(item, d) {
      const catClass = CATEGORY_CLASS[item.category] || '';
      const month = d.toLocaleDateString('en-GB', { month: 'short' });
      const end = item.dateEnd && item.dateEnd !== item.dateStart ? new Date(item.dateEnd) : null;
      const day = end ? d.getDate() + '–' + end.getDate() : String(d.getDate());
      const dateLabel = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) +
        (end ? ' to ' + end.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }) : '');
      const meta = renderMeta(item.location);
      const notes = item.notes && item.notes.length
        ? '<div class="event-notes clamped">' + renderRich(item.notes) + '</div>'
        : '';
      return (
        '<div class="event-row ' + catClass + '">' +
          '<div class="event-date" aria-label="' + escapeHtml(dateLabel) + '">' +
            '<span class="event-day' + (end ? ' range' : '') + '">' + day + '</span>' +
            '<span class="event-month">' + month + '</span>' +
          '</div>' +
          '<div class="event-body">' +
            '<div class="event-purpose">' + escapeHtml(item.purpose || '') + '</div>' +
            meta + notes +
          '</div>' +
        '</div>'
      );
    }

    // Notes show up to 2 lines; Read more appears only when they run longer.
    function wireReadMore() {
      document.querySelectorAll('.event-notes.clamped').forEach(n => {
        if (n.scrollHeight <= n.clientHeight + 1) { n.classList.remove('clamped'); return; }
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'read-more'; b.textContent = 'Read more';
        b.setAttribute('aria-expanded', 'false');
        b.addEventListener('click', () => {
          const open = !n.classList.toggle('clamped');
          b.textContent = open ? 'Read less' : 'Read more';
          b.setAttribute('aria-expanded', String(open));
        });
        n.after(b);
      });
    }

    // One quiet line: venue (linked to the map) · town.
    function renderMeta(loc) {
      if (!loc) return '';
      if (typeof loc === 'string') loc = { name: loc };
      if (!loc.name) return '';
      const name = loc.mapUrl
        ? '<a href="' + escapeHtml(loc.mapUrl) + '" target="_blank" rel="noopener">' + escapeHtml(loc.name) + '</a>'
        : escapeHtml(loc.name);
      return '<div class="event-meta">' + name + (loc.detail ? ' · ' + escapeHtml(loc.detail) : '') + '</div>';
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    loadEvents();
  </script>
</body>
</html>
