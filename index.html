<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Noticeboard — Nourish UX/Design</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="site">
    <div class="wrap">
      <div class="brand">Team Noticeboard <span>Nourish UX/Design</span></div>
      <nav class="tabs">
        <a href="/" class="active">Updates</a>
        <a href="/dates.html">Team Dates</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page-title">Team Updates</h1>
    <p class="page-sub">Announcements, hiring news and decisions.</p>

    <div id="content">
      <div class="state">Loading updates…</div>
    </div>
  </main>

  <script>
    async function loadUpdates() {
      const el = document.getElementById('content');
      try {
        const res = await fetch('/.netlify/functions/announcements');
        if (!res.ok) throw new Error('Request failed: ' + res.status);
        const data = await res.json();
        if (!data.length) {
          el.innerHTML = '<div class="state">No updates yet.</div>';
          return;
        }
        el.innerHTML = data.map(renderCard).join('');
      } catch (err) {
        el.innerHTML = '<div class="state error">Couldn\'t load updates right now (' + err.message + '). Check that the Netlify function is deployed and NOTION_TOKEN is set.</div>';
      }
    }

    function renderCard(item) {
      const dateStr = item.date
        ? new Date(item.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
        : '';
      const actionPill = item.actionNeeded && item.actionNeeded !== 'No'
        ? '<span class="pill action">' + escapeHtml(item.actionNeeded) + '</span>'
        : '';
      return (
        '<div class="update-card">' +
          '<div class="update-meta">' +
            (item.subject ? '<span class="pill">' + escapeHtml(item.subject) + '</span>' : '') +
            '<span class="update-date">' + dateStr + '</span>' +
            actionPill +
          '</div>' +
          '<div class="update-body">' + escapeHtml(item.update || '') + '</div>' +
        '</div>'
      );
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    loadUpdates();
  </script>
</body>
</html>
